<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QianLink Admin Panel</title>
<style>
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:#0b0e14; color:#f3f4f6; padding:16px; }
  .wrap { max-width:540px; margin:0 auto; }
  .card { background:#131720; border:1px solid #1f2937; border-radius:16px; padding:16px; margin-bottom:16px; }
  input, textarea { width:100%; box-sizing:border-box; padding:10px; border-radius:10px; border:1px solid #374151; background:#0b0e14; color:#fff; margin-top:4px; margin-bottom:10px; }
  .btn { width:100%; padding:12px; border:none; border-radius:10px; background:#10b981; color:#000; font-weight:800; cursor:pointer; }
  .btn-blue { background:#2563eb; color:#fff; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ord { background:#0b0e14; border:1px solid #1f2937; padding:12px; border-radius:10px; margin-bottom:10px; font-size:13px; }
</style>
</head>
<body>
<script>
if (sessionStorage.getItem('ql_auth') !== '1') {
  const p = prompt('🔒 Enter Admin Password:');
  if (p === 'SAMAR@0219') sessionStorage.setItem('ql_auth', '1');
  else { document.body.innerHTML = '<h2 style="text-align:center;margin-top:60px;color:#ef4444;">❌ Access Denied</h2>'; throw new Error('Denied'); }
}
</script>
<div class="wrap">
  <h2 style="color:#10b981;">⚙️ QianLink Admin Control</h2>

  <div class="card">
    <h3 style="margin-top:0;">1. Live INR Rates</h3>
    <div class="grid">
      <div><label>🎮 Gaming</label><input type="number" step="0.01" id="r_gaming" /></div>
      <div><label>📈 Stock</label><input type="number" step="0.01" id="r_stock" /></div>
      <div><label>🔄 Mix</label><input type="number" step="0.01" id="r_mix" /></div>
      <div><label>💎 Pure</label><input type="number" step="0.01" id="r_pure" /></div>
    </div>
    <button class="btn" onclick="saveRates()">💾 Save Live Rates</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">2. Wallet & Promo Settings</h3>
    <label>TRC-20 Wallet Address</label>
    <input type="text" id="s_wallet" />
    <label>Promo Message Text</label>
    <textarea rows="3" id="s_promo"></textarea>
    <label>USDT Work / Exchange Link (Button 1)</label>
    <input type="text" id="s_ex" />
    <label>Any Enquiry / Support Link (Button 2)</label>
    <input type="text" id="s_enq" />
    <button class="btn btn-blue" onclick="saveSettings()">💾 Save Wallet & Promo Settings</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">3. Upload TRC-20 QR Code</h3>
    <input type="file" id="qrFile" accept="image/*" />
    <button class="btn" onclick="uploadQr()">📤 Upload QR Image</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">4. Client Orders</h3>
    <div id="orderList">Loading...</div>
  </div>
</div>

<script>
async function load() {
  const res = await fetch('/api/state');
  const d = await res.json();
  ['gaming','stock','mix','pure'].forEach(k => document.getElementById('r_'+k).value = d.rates[k]);
  document.getElementById('s_wallet').value = d.settings.wallet;
  document.getElementById('s_promo').value = d.settings.promoText;
  document.getElementById('s_ex').value = d.settings.exchangeLink;
  document.getElementById('s_enq').value = d.settings.enquiryLink;
  document.getElementById('orderList').innerHTML = d.orders.length ? d.orders.map(o => `
    <div class="ord">
      <strong>#${o.id} — ${o.fund} (${o.usdt} USDT → ₹${o.inr})</strong> [${o.status}]<br/>
      Bank/UPI: ${o.bank}<br/>TxID: ${o.txId}<br/>Time: ${o.time}<br/>
      <button onclick="setSt('${o.id}','Paid')" style="margin-top:6px;background:#10b981;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;">✅ Mark Paid</button>
    </div>`).join('') : 'No orders yet.';
}
async function saveRates() {
  const body = {};
  ['gaming','stock','mix','pure'].forEach(k => body[k] = parseFloat(document.getElementById('r_'+k).value));
  await fetch('/api/rates', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  alert('✅ Rates Updated!');
}
async function saveSettings() {
  const body = {
    wallet: document.getElementById('s_wallet').value.trim(),
    promoText: document.getElementById('s_promo').value.trim(),
    exchangeLink: document.getElementById('s_ex').value.trim(),
    enquiryLink: document.getElementById('s_enq').value.trim()
  };
  await fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  alert('✅ Settings Saved!');
}
async function uploadQr() {
  const f = document.getElementById('qrFile').files[0];
  if (!f) return alert('Select an image first');
  const fd = new FormData(); fd.append('qr', f);
  await fetch('/api/upload-qr', { method:'POST', body:fd });
  alert('✅ QR Uploaded!');
}
async function setSt(id, status) {
  await fetch('/api/order-status', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, status}) });
  load();
}
load();
</script>
</body>
</html>

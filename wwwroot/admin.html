<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QianLink Admin Panel</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #090d16; color: #f1f5f9; padding: 16px; }
  .wrap { max-width: 560px; margin: 0 auto; padding-bottom: 40px; }
  .card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  h3 { margin-top: 0; color: #34d399; font-size: 16px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #334155; background: #090d16; color: #fff; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #10b981; color: #02140d; font-weight: 800; cursor: pointer; }
  .btn-blue { background: #2563eb; color: #fff; }
  .btn-amber { background: #f59e0b; color: #000; }
  .btn-red { background: #ef4444; color: #fff; }
  .ord { background: #090d16; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
  .rec-link { display: inline-block; background: #1e293b; color: #38bdf8; padding: 5px 10px; border-radius: 6px; text-decoration: none; font-weight: 700; margin-top: 6px; margin-right: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h2 style="color:#10b981;margin-bottom:4px;">⚙️ QianLink Admin Control</h2>
  <p style="font-size:12px;color:#64748b;margin-top:0;">Auto-deletes records older than 3 days.</p>

  <div class="card" style="border-color:#f59e0b;">
    <h3>🚦 Desk Status (1-Click ON / OFF)</h3>
    <p id="deskStatusTxt" style="font-weight:800;font-size:15px;">Checking...</p>
    <button type="button" id="toggleDeskBtn" class="btn" onclick="toggleDesk()">Loading...</button>
  </div>

  <div class="card">
    <h3>1. Live INR Rates & Minimum USDT Limits</h3>
    <div class="grid">
      <div><label>🎮 Gaming Rate</label><input type="number" step="0.01" id="r_gaming" /></div>
      <div><label>🎮 Gaming Min</label><input type="number" id="m_gaming" /></div>
      <div><label>📈 Stock Rate</label><input type="number" step="0.01" id="r_stock" /></div>
      <div><label>📈 Stock Min</label><input type="number" id="m_stock" /></div>
      <div><label>🔄 Mix Rate</label><input type="number" step="0.01" id="r_mix" /></div>
      <div><label>🔄 Mix Min</label><input type="number" id="m_mix" /></div>
      <div><label>💎 Rathat Rate</label><input type="number" step="0.01" id="r_pure" /></div>
      <div><label>💎 Rathat Min</label><input type="number" id="m_pure" /></div>
    </div>
    <button type="button" class="btn" onclick="saveRates()">💾 Save Rates & Limits</button>
  </div>

  <div class="card">
    <h3>2. Wallet & Promo Settings</h3>
    <label>TRC-20 Wallet Address</label><input type="text" id="s_wallet" />
    <label>Promo Text</label><textarea rows="2" id="s_promo"></textarea>
    <label>Button 1 Link</label><input type="text" id="s_ex" />
    <label>Button 2 Link</label><input type="text" id="s_enq" />
    <button type="button" class="btn btn-blue" onclick="saveSettings()">💾 Save Settings</button>
  </div>

  <div class="card">
    <h3>3. Upload TRC-20 QR (.JPG / .PNG)</h3>
    <input type="file" id="qrFile" accept="image/*" />
    <button type="button" class="btn" onclick="uploadQr()">📤 Upload QR</button>
    <div id="curQrPreview" style="text-align:center;margin-top:10px;"></div>
  </div>

  <div class="card">
    <h3>4. Change Admin Password</h3>
    <input type="password" id="newPass" placeholder="Enter New Password" />
    <button type="button" class="btn btn-amber" onclick="changePass()">🔑 Update Password</button>
  </div>

  <div class="card">
    <h3>5. Active Orders (Last 3 Days)</h3>
    <div id="orderList">Loading...</div>
  </div>
</div>
<script>
let adminPwd = sessionStorage.getItem("ql_pwd") || "";
let deskOpen = true;

function renderDeskBtn() {
  const txt = document.getElementById("deskStatusTxt");
  const btn = document.getElementById("toggleDeskBtn");
  if (deskOpen) {
    txt.innerHTML = 'Current Status: <span style="color:#34d399;">● LIVE & OPEN</span>';
    btn.className = "btn btn-red";
    btn.innerText = "🛑 Stop / Close Public Desk";
  } else {
    txt.innerHTML = 'Current Status: <span style="color:#ef4444;">● CLOSED / MAINTENANCE</span>';
    btn.className = "btn";
    btn.innerText = "🟢 Start / Open Public Desk";
  }
}

async function toggleDesk() {
  const r = await fetch("/api/admin/toggle-desk", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: adminPwd, isOpen: !deskOpen })
  });
  if (r.ok) {
    const j = await r.json();
    deskOpen = j.isOpen;
    renderDeskBtn();
  }
}

async function authAndLoad() {
  if (!adminPwd) adminPwd = prompt("🔒 Enter Admin Password:") || "";
  const res = await fetch("/api/admin/state", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: adminPwd })
  });
  if (!res.ok) {
    sessionStorage.removeItem("ql_pwd");
    document.body.innerHTML = '<h2 style="text-align:center;margin-top:60px;color:#ef4444;">❌ Wrong Password! Refresh to try again.</h2>';
    return;
  }
  sessionStorage.setItem("ql_pwd", adminPwd);
  const d = await res.json();
  deskOpen = d.isOpen !== false;
  renderDeskBtn();
  ["gaming","stock","mix","pure"].forEach(k => {
    document.getElementById("r_"+k).value = d.rates[k];
    document.getElementById("m_"+k).value = d.minLimits[k];
  });
  document.getElementById("s_wallet").value = d.settings.wallet;
  document.getElementById("s_promo").value = d.settings.promoText;
  document.getElementById("s_ex").value = d.settings.exchangeLink;
  document.getElementById("s_enq").value = d.settings.enquiryLink;
  if (d.qrUrl) {
    document.getElementById("curQrPreview").innerHTML = `<img src="${d.qrUrl}?t=${Date.now()}" style="width:130px;height:130px;background:#fff;padding:5px;border-radius:10px;" />`;
  }
  document.getElementById("orderList").innerHTML = d.orders.length ? d.orders.map(o => `
    <div class="ord">
      <strong style="color:#fbbf24;">${o.token}</strong> — <b>${o.fund}</b> (${o.usdt} USDT → <span style="color:#34d399;">₹${o.inr}</span>) [<b>${o.status}</b>]<br/>
      🏦 <b>${o.holder}</b> | A/C: ${o.accNo} | IFSC: ${o.ifsc}<br/>🕒 ${o.timeIst}<br/>
      <a href="${o.receiptUrl}" target="_blank" class="rec-link">🖼️ View Receipt</a>
      <button type="button" onclick="setSt('${o.token}','Paid')" style="background:#10b981;border:none;padding:6px 10px;border-radius:6px;font-weight:700;cursor:pointer;">✅ Mark Paid</button>
    </div>`).join("") : "No orders in last 3 days.";
}

async function saveRates() {
  const rates = {}, minLimits = {};
  ["gaming","stock","mix","pure"].forEach(k => {
    rates[k] = parseFloat(document.getElementById("r_"+k).value);
    minLimits[k] = parseFloat(document.getElementById("m_"+k).value);
  });
  await fetch("/api/rates", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: adminPwd, rates, minLimits }) });
  alert("✅ Saved!");
}

async function saveSettings() {
  const settings = {
    wallet: document.getElementById("s_wallet").value.trim(),
    promoText: document.getElementById("s_promo").value.trim(),
    exchangeLink: document.getElementById("s_ex").value.trim(),
    enquiryLink: document.getElementById("s_enq").value.trim()
  };
  await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: adminPwd, settings }) });
  alert("✅ Saved!");
}

async function uploadQr() {
  const inp = document.getElementById("qrFile");
  const f = inp.files ? inp.files.item(0) : null;
  if (!f) return alert("Select image first!");
  const fd = new FormData();
  fd.append("password", adminPwd);
  fd.append("qr", f);
  const r = await fetch("/api/upload-qr", { method: "POST", body: fd });
  if (r.ok) { alert("✅ QR Uploaded!"); authAndLoad(); }
}

async function changePass() {
  const np = document.getElementById("newPass").value.trim();
  if (np.length < 4) return alert("Min 4 chars!");
  const r = await fetch("/api/admin/password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ oldPassword: adminPwd, newPassword: np }) });
  if (r.ok) {
    adminPwd = np;
    sessionStorage.setItem("ql_pwd", np);
    document.getElementById("newPass").value = "";
    alert("✅ Password Updated!");
  }
}

async function setSt(token, status) {
  await fetch("/api/order-status", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: adminPwd, token, status }) });
  authAndLoad();
}

authAndLoad();
</script>
</body>
</html>

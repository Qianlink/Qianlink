<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>USDT ⇄ INR PRO — Instant Desk</title>
<script src="https://telegram.org"></script>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #090d16; color: #f1f5f9; padding: 14px; min-height: 100vh; }
  .wrap { max-width: 450px; margin: 0 auto; padding-bottom: 30px; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .title-row { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: #fff; }
  .pro-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 6px; }
  .sub-title { font-size: 12px; color: #64748b; margin-top: 2px; }
  .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(16,185,129,0.12); border: 1px solid #10b981; color: #10b981; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 800; box-shadow: 0 0 15px rgba(16,185,129,0.35); }
  .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

  .sel-card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sel-lbl { font-size: 12px; color: #94a3b8; }
  .sel-val { font-size: 20px; font-weight: 800; color: #34d399; margin-top: 3px; }
  .fund-pill { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; }

  .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }

  /* Floating Wave Fund Cards */
  .fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .wave-card { position: relative; overflow: hidden; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; cursor: pointer; transition: 0.25s; }
  .wave-card.active { border-color: #10b981; box-shadow: 0 0 18px rgba(16,185,129,0.25); }
  .wave-card::before, .wave-card::after {
    content: ""; position: absolute; left: -50%; width: 200%; height: 200%; border-radius: 42%;
    background: rgba(16, 185, 129, 0.12); bottom: -145%; animation: floatWave 6s linear infinite; pointer-events: none;
  }
  .wave-card::after { background: rgba(14, 165, 233, 0.10); border-radius: 45%; bottom: -148%; animation: floatWave 9s linear infinite reverse; }
  .wave-card.active::before { background: rgba(16, 185, 129, 0.24); bottom: -135%; }
  @keyframes floatWave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .wc-name { position: relative; z-index: 2; font-size: 13px; font-weight: 700; color: #e2e8f0; }
  .wc-rate { position: relative; z-index: 2; font-size: 21px; font-weight: 800; color: #34d399; margin-top: 4px; }

  .box { background: #111827; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 13px 14px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
  input:focus { border-color: #10b981; }

  .receive-wave {
    position: relative; overflow: hidden; border-radius: 14px; padding: 16px; text-align: center;
    background: linear-gradient(135deg, #06373a, #0b2538); border: 1px solid #14b8a6; margin-bottom: 16px;
  }
  .receive-wave::before {
    content: ""; position: absolute; left: -50%; bottom: -165%; width: 200%; height: 220%;
    background: rgba(20, 184, 166, 0.22); border-radius: 43%; animation: floatWave 7s linear infinite;
  }
  .receive-wave span { position: relative; z-index: 2; display: block; font-size: 12px; color: #99f6e4; margin-bottom: 4px; }
  .receive-wave strong { position: relative; z-index: 2; font-size: 26px; color: #fff; font-weight: 800; }

  .qr-sec { text-align: center; background: #090d16; border: 1px dashed #334155; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .qr-sec img { width: 150px; height: 150px; background: #fff; padding: 5px; border-radius: 10px; margin-bottom: 8px; }
  .w-addr { font-family: monospace; font-size: 12px; color: #fbbf24; word-break: break-all; margin-bottom: 8px; }
  .copy-b { background: #1e293b; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

  .sub-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: #02140d; font-size: 16px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
  .sup-btn { display: block; text-align: center; background: #1d4ed8; color: #fff; text-decoration: none; padding: 13px; border-radius: 14px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <div>
      <div class="title-row">USDT ⇄ INR <span class="pro-badge">PRO</span></div>
      <div class="sub-title">Instant Desk & Fund Calculator</div>
    </div>
    <div class="live-badge"><span class="dot"></span> LIVE</div>
  </div>

  <div class="sel-card">
    <div>
      <div class="sel-lbl">Selected Rate</div>
      <div class="sel-val" id="selRateTxt">1 USDT = ₹104</div>
    </div>
    <div class="fund-pill" id="selFundPill">Gaming Funds</div>
  </div>

  <div class="sec-lbl">SELECT FUND CATEGORY & RATE</div>
  <div class="fund-grid" id="fundGrid"></div>

  <div class="box">
    <label>Enter USDT Amount (Minimum 1000 USDT)</label>
    <input type="number" id="usdtAmt" value="1000" oninput="calc()" />

    <div class="receive-wave">
      <span>You Will Receive (INR)</span>
      <strong id="inrVal">₹1,04,000.00</strong>
    </div>

    <div class="sec-lbl">BANK ACCOUNT DETAILS FOR INR PAYOUT</div>
    <input type="text" id="accName" placeholder="Account Holder Name" />
    <input type="number" id="accNum" placeholder="Bank Account Number (Numbers Only)" />
    <input type="text" id="ifsc" placeholder="IFSC CODE (E.G. SBIN0001234)" style="text-transform:uppercase;" />

    <div class="sec-lbl" style="margin-top:6px;">DEPOSIT USDT (TRC-20) & TXID</div>
    <div class="qr-sec">
      <img src="/my-qr.png" onerror="this.style.display='none'" alt="QR" />
      <div class="w-addr" id="walletBox">Loading wallet...</div>
      <button class="copy-b" onclick="copyW()">📋 Copy TRC-20 Address</button>
    </div>
    <input type="text" id="txId" placeholder="Paste TRC-20 Transaction Hash (TxID)" />

    <button class="sub-btn" onclick="submitOrd()">🚀 Submit Payout Request</button>
    <a id="supLink" href="https://t.me" target="_blank" class="sup-btn">💬 24/7 Live Support Desk</a>
  </div>
</div>

<script>
if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }
let rates = { gaming: 104, stock: 117, mix: 128, pure: 145 };
let curFund = 'gaming';
const labels = { gaming: 'Gaming Funds', stock: 'Stock Funds', mix: 'Mix Funds', pure: 'Pure Funds' };

async function loadState() {
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    rates = d.rates;
    document.getElementById('walletBox').innerText = d.settings.wallet;
    document.getElementById('supLink').href = d.settings.enquiryLink;
  } catch (e) {}
  renderCards();
  calc();
}

function renderCards() {
  document.getElementById('fundGrid').innerHTML = Object.keys(labels).map(k => `
    <div class="wave-card ${curFund === k ? 'active' : ''}" onclick="selectFund('${k}')">
      <div class="wc-name">${labels[k]}</div>
      <div class="wc-rate">₹${rates[k]}</div>
    </div>
  `).join('');
  document.getElementById('selRateTxt').innerText = `1 USDT = ₹${rates[curFund]}`;
  document.getElementById('selFundPill').innerText = labels[curFund];
}

function selectFund(k) {
  curFund = k;
  renderCards();
  calc();
}

function calc() {
  const u = parseFloat(document.getElementById('usdtAmt').value) || 0;
  const total = u * (rates[curFund] || 0);
  document.getElementById('inrVal').innerText = '₹' + total.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function copyW() {
  navigator.clipboard.writeText(document.getElementById('walletBox').innerText);
  alert('✅ TRC-20 Wallet Address Copied!');
}

async function submitOrd() {
  const name = document.getElementById('accName').value.trim();
  const num = document.getElementById('accNum').value.trim();
  const ifsc = document.getElementById('ifsc').value.trim().toUpperCase();
  const txId = document.getElementById('txId').value.trim();
  const usdt = parseFloat(document.getElementById('usdtAmt').value) || 0;

  if (usdt <= 0 || !name || !num || !ifsc || !txId) {
    return alert('⚠️ Please fill USDT Amount, Account Holder Name, Account Number, IFSC Code, and TxID!');
  }
  const bankDetails = `${name} | A/C: ${num} | IFSC: ${ifsc}`;
  const res = await fetch('/api/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fund: curFund, usdt, bank: bankDetails, txId })
  });
  const j = await res.json();
  if (j.ok) {
    alert('✅ Order #' + j.id + ' Submitted! INR Payout Processing.');
    document.getElementById('txId').value = '';
  }
}
loadState();
</script>
</body>
</html>

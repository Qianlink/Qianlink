<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QIANLINK — USDT ⇄ INR PRO Desk</title>
<script src="https://telegram.org"></script>
<script src="https://cloudflare.com"></script>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: #090d16; color: #f1f5f9; padding: 14px; min-height: 100vh; }
  .wrap { max-width: 450px; margin: 0 auto; padding-bottom: 30px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .brand-name {
    font-size: 16px; font-weight: 900; letter-spacing: 3.5px; margin-bottom: 3px; text-transform: uppercase;
    background: linear-gradient(90deg, #fbbf24, #34d399, #38bdf8, #f59e0b, #fbbf24);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: brandGlow 4s linear infinite;
    filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.35));
  }
  @keyframes brandGlow { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  .title-row { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; color: #fff; }
  .pro-badge { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 6px; }
  .sub-title { font-size: 12px; color: #64748b; margin-top: 2px; }
  .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(16,185,129,0.12); border: 1px solid #10b981; color: #10b981; padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 800; box-shadow: 0 0 15px rgba(16,185,129,0.35); }
  .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
  .sel-card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sel-lbl { font-size: 12px; color: #94a3b8; }
  .sel-val { font-size: 20px; font-weight: 800; color: #34d399; margin-top: 3px; }
  .fund-pill { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.4); color: #fbbf24; padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #64748b; margin-bottom: 10px; text-transform: uppercase; }
  .fund-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .wave-card { position: relative; overflow: hidden; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; cursor: pointer; transition: 0.25s; }
  .wave-card.active { border-color: #10b981; box-shadow: 0 0 18px rgba(16,185,129,0.28); }
  .wave-card::before, .wave-card::after { content: ""; position: absolute; left: -50%; width: 200%; height: 200%; border-radius: 41%; background: rgba(20, 184, 166, 0.16); bottom: -132%; animation: floatWave 5s linear infinite; pointer-events: none; }
  .wave-card::after { background: rgba(14, 165, 233, 0.14); border-radius: 44%; bottom: -136%; animation: floatWave 8s linear infinite reverse; }
  .wave-card.active::before { background: rgba(16, 185, 129, 0.28); bottom: -124%; }
  @keyframes floatWave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .wc-name { position: relative; z-index: 2; font-size: 13px; font-weight: 700; color: #e2e8f0; }
  .wc-rate { position: relative; z-index: 2; font-size: 22px; font-weight: 800; color: #34d399; margin-top: 3px; }
  .wc-min { position: relative; z-index: 2; font-size: 11px; color: #fbbf24; font-weight: 600; margin-top: 4px; }
  .box { background: #111827; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 13px 14px; color: #fff; font-size: 15px; margin-bottom: 12px; outline: none; }
  input:focus { border-color: #10b981; }
  .receive-wave { position: relative; overflow: hidden; border-radius: 14px; padding: 18px; text-align: center; background: linear-gradient(135deg, #064044, #0c2d48); border: 1px solid #14b8a6; margin-bottom: 14px; }
  .receive-wave::before, .receive-wave::after { content: ""; position: absolute; left: -50%; bottom: -152%; width: 200%; height: 220%; background: rgba(20, 184, 166, 0.28); border-radius: 42%; animation: floatWave 6s linear infinite; }
  .receive-wave::after { background: rgba(56, 189, 248, 0.18); bottom: -156%; animation: floatWave 9s linear infinite reverse; }
  .receive-wave span { position: relative; z-index: 2; display: block; font-size: 12px; color: #99f6e4; margin-bottom: 4px; }
  .receive-wave strong { position: relative; z-index: 2; font-size: 28px; color: #fff; font-weight: 800; }
  .sup-btn { display: block; text-align: center; background: rgba(37,99,235,0.16); border: 1px solid #3b82f6; color: #93c5fd; text-decoration: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; margin-bottom: 12px; }
  .next-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, #10b981, #059669); color: #02140d; font-size: 16px; font-weight: 800; cursor: pointer; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #090d16; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 14px; font-size: 12px; }
  .sum-item span { display: block; color: #64748b; font-size: 11px; }
  .sum-item strong { font-size: 14px; }
  .qr-card { text-align: center; background: #090d16; border: 1px dashed #f59e0b; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .qr-box-wrap { display: inline-block; background: #fff; padding: 10px; border-radius: 14px; margin-bottom: 10px; }
  .qr-box-wrap img { width: 180px; height: 180px; object-fit: contain; display: block; }
  .w-addr { font-family: monospace; font-size: 12px; color: #fbbf24; word-break: break-all; background: #111827; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
  .copy-b { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .back-b { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 8px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; margin-bottom: 12px; }
  .slip-preview { display: none; text-align: center; background: #090d16; border: 1px solid #10b981; border-radius: 12px; padding: 10px; margin-bottom: 12px; }
  .slip-preview img { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; margin: 6px auto 0; }
  .token-box { text-align: center; padding: 20px; background: linear-gradient(145deg, #062c22, #090d16); border: 1px solid #10b981; border-radius: 18px; }
  .tok-num { font-size: 26px; font-weight: 900; color: #fbbf24; letter-spacing: 1px; background: #090d16; padding: 12px; border-radius: 12px; border: 1px dashed #10b981; margin: 12px 0; }
  .timer-pill { display: inline-block; background: rgba(245,158,11,0.15); border: 1px solid #f59e0b; color: #fbbf24; padding: 8px 16px; border-radius: 99px; font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .patience-msg { font-size: 12px; color: #a7f3d0; line-height: 1.5; margin: 6px 0 12px; background: rgba(16,185,129,0.08); padding: 10px; border-radius: 10px; border: 1px solid rgba(16,185,129,0.25); }
  .track-row { display: flex; gap: 8px; }
  .track-row input { margin-bottom: 0; text-transform: uppercase; }
  .track-btn { padding: 0 16px; border: none; border-radius: 12px; background: #2563eb; color: #fff; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .track-res { margin-top: 10px; padding: 12px; border-radius: 12px; background: #090d16; border: 1px solid #1e293b; font-size: 13px; display: none; text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="appRoot"></div>
<script>
if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.expand(); }
let rates = { gaming: 104, stock: 117, mix: 128, pure: 145 };
let mins  = { gaming: 1000, stock: 1500, mix: 2000, pure: 2500 };
let curFund = 'gaming';
let walletAddr = 'TBMdnk1sTcAxSjb9b129cvkRs6eb9TQzgt';
let customQrUrl = '';
let finalTimerInt = null;
let trackTimerInt = null;
const labels = { gaming: 'Gaming Funds', stock: 'Stock Funds', mix: 'Mix Funds', pure: 'Red Funds' };

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.innerText = txt;
  return e;
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return m + ':' + s;
}

function buildUI() {
  const root = document.getElementById('appRoot');
  root.innerHTML = '';

  const top = el('div', 'top-bar');
  const left = el('div');
  left.appendChild(el('div', 'brand-name', '✨ QIANLINK ✨'));
  const trow = el('div', 'title-row', 'USDT ⇄ INR ');
  trow.appendChild(el('span', 'pro-badge', 'PRO'));
  left.appendChild(trow);
  left.appendChild(el('div', 'sub-title', 'Instant Desk & Fund Calculator'));
  const live = el('div', 'live-badge');
  live.appendChild(el('span', 'dot'));
  live.appendChild(document.createTextNode(' LIVE'));
  top.append(left, live);
  root.appendChild(top);

  const closed = el('div', 'box');
  closed.id = 'closedBox';
  closed.style.display = 'none';
  closed.style.textAlign = 'center';
  closed.appendChild(el('h2', '', '🚧 Desk Temporarily Closed'));
  closed.appendChild(el('p', 'sub-title', 'Please check back later or contact support.'));
  root.appendChild(closed);

  const main = el('div'); main.id = 'mainApp';

  const p1 = el('div'); p1.id = 'page1';
  const sc = el('div', 'sel-card');
  const scL = el('div');
  scL.appendChild(el('div', 'sel-lbl', 'Selected Rate'));
  const srv = el('div', 'sel-val', '1 USDT = ₹104'); srv.id = 'selRateTxt';
  scL.appendChild(srv);
  const pill = el('div', 'fund-pill', 'Gaming Funds'); pill.id = 'selFundPill';
  sc.append(scL, pill);
  p1.appendChild(sc);
  p1.appendChild(el('div', 'sec-lbl', 'SELECT FUND CATEGORY & RATE'));
  const fg = el('div', 'fund-grid'); fg.id = 'fundGrid';
  p1.appendChild(fg);

  const b1 = el('div', 'box');
  const ml = el('label', '', 'Enter USDT Amount (Minimum 1000 USDT)'); ml.id = 'minInputLbl';
  const uIn = el('input'); uIn.type = 'number'; uIn.id = 'usdtAmt'; uIn.placeholder = 'Enter USDT amount';
  uIn.oninput = calcOnly;

  const rw = el('div', 'receive-wave');
  rw.appendChild(el('span', '', 'You Will Receive (INR)'));
  const iv = el('strong', '', '₹0.00'); iv.id = 'inrVal';
  rw.appendChild(iv);

  const nIn = el('input'); nIn.type = 'text'; nIn.id = 'accName'; nIn.placeholder = 'Account Holder Name';
  const aIn = el('input'); aIn.type = 'number'; aIn.id = 'accNum'; aIn.placeholder = 'Bank Account Number (Numbers Only)';
  const iIn = el('input'); iIn.type = 'text'; iIn.id = 'ifsc'; iIn.placeholder = 'IFSC CODE (E.G. SBIN0001234)'; iIn.style.textTransform = 'uppercase';

  const sup = el('a', 'sup-btn', '💬 24/7 Live Support Desk'); sup.id = 'supLink'; sup.href = 'https://t.me'; sup.target = '_blank';
  const nb = el('button', 'next-btn', 'Proceed to Deposit & QR ➔'); nb.type = 'button'; nb.onclick = tryProceed;

  b1.append(ml, uIn, rw, el('div', 'sec-lbl', 'BANK ACCOUNT DETAILS FOR INR PAYOUT'), nIn, aIn, iIn, sup, nb);
  p1.appendChild(b1);

  const tbCard = el('div', 'box');
  tbCard.appendChild(el('div', 'sec-lbl', '🔍 CHECK TOKEN / PAYOUT STATUS'));
  const tr = el('div', 'track-row');
  const tIn = el('input'); tIn.type = 'text'; tIn.id = 'trackInput'; tIn.placeholder = 'Enter Token (e.g. QL-123456)';
  const tBtn = el('button', 'track-btn', 'Check Status'); tBtn.type = 'button'; tBtn.onclick = checkTokenStatus;
  tr.append(tIn, tBtn);
  const tRes = el('div', 'track-res'); tRes.id = 'trackResult';
  tbCard.append(tr, tRes);
  p1.appendChild(tbCard);
  const p2 = el('div'); p2.id = 'page2'; p2.style.display = 'none';
  const bk = el('button', 'back-b', '← Back to Edit Details'); bk.type = 'button'; bk.onclick = goPage1;
  p2.appendChild(bk);

  const b2 = el('div', 'box');
  b2.appendChild(el('div', 'sec-lbl', 'STEP 2: SCAN QR / SEND USDT (TRC-20)'));
  const sg = el('div', 'summary-grid');
  [['Selected Fund','p2Fund','#fbbf24'],['Applied Rate','p2Rate','#38bdf8'],['Deposit USDT','p2Usdt','#fff'],['Total INR Payout','p2Inr','#34d399']].forEach(([t,id,col]) => {
    const it = el('div', 'sum-item');
    it.appendChild(el('span', '', t));
    const st = el('strong'); st.id = id; st.style.color = col;
    it.appendChild(st);
    sg.appendChild(it);
  });
  b2.appendChild(sg);

  const qc = el('div', 'qr-card');
  const qt = el('div', '', 'SCAN TRC-20 QR CODE TO PAY'); qt.style.cssText = 'font-size:11px;color:#fbbf24;font-weight:700;margin-bottom:8px;';
  const qw = el('div', 'qr-box-wrap'); qw.id = 'qrContainer';
  const wa = el('div', 'w-addr', 'Loading...'); wa.id = 'walletBox';
  const cb = el('button', 'copy-b', '📋 Copy TRC-20 Wallet Address'); cb.type = 'button'; cb.onclick = copyW;
  qc.append(qt, qw, wa, cb);
  b2.appendChild(qc);

  b2.appendChild(el('label', '', 'Upload Payment Receipt Screenshot (Mandatory)'));
  const fi = el('input'); fi.type = 'file'; fi.id = 'receiptFile'; fi.accept = 'image/*';
  fi.onchange = function() { previewSlip(this); };
  b2.appendChild(fi);

  const sp = el('div', 'slip-preview'); sp.id = 'slipPreviewBox';
  const spt = el('span', '', '✅ Uploaded Payment Slip Preview:'); spt.style.cssText = 'font-size:11px;color:#34d399;font-weight:700;';
  const spi = el('img'); spi.id = 'slipPreviewImg';
  sp.append(spt, spi);
  b2.appendChild(sp);

  const sb = el('button', 'next-btn', '✅ Submit Receipt & Generate Token'); sb.type = 'button'; sb.id = 'subBtn'; sb.onclick = submitFinal;
  b2.appendChild(sb);
  p2.appendChild(b2);

  const p3 = el('div'); p3.id = 'page3'; p3.style.display = 'none';
  const tb = el('div', 'token-box');
  tb.appendChild(el('h2', '', '🎉 Order Submitted!'));
  const tp = el('div', 'timer-pill', '⏳ Settlement Timer: 60:00'); tp.id = 'finalTimerPill';
  const patMsg = el('p', 'patience-msg', '🙏 Please stay patient & relaxed. Your INR payout is under fast verification and will be credited to your bank account before the timer ends. You can also check your live status anytime on the home page using your token number.');
  const tn = el('div', 'tok-num', 'QL-000000'); tn.id = 'finalToken';
  const fiTxt = el('p', '', 'Estimated Payout: ');
  const fiVal = el('strong', '', '₹0.00'); fiVal.id = 'finalInr'; fiVal.style.color = '#34d399';
  fiTxt.appendChild(fiVal);
  const rb = el('button', 'next-btn', '➕ Place New Order'); rb.type = 'button'; rb.onclick = () => location.reload();
  tb.append(tp, patMsg, tn, fiTxt, rb);
  p3.appendChild(tb);

  main.append(p1, p2, p3);
  root.appendChild(main);
}

function startFinalCountdown() {
  if (finalTimerInt) clearInterval(finalTimerInt);
  let rem = 3600;
  const pill = document.getElementById('finalTimerPill');
  pill.innerText = '⏳ Settlement Timer: ' + fmtTime(rem);
  finalTimerInt = setInterval(() => {
    rem--;
    if (rem <= 0) {
      clearInterval(finalTimerInt);
      pill.innerText = '⚠️ 60:00 Completed — Check Status on Home';
    } else {
      pill.innerText = '⏳ Settlement Timer: ' + fmtTime(rem);
    }
  }, 1000);
}

async function checkTokenStatus() {
  const tok = document.getElementById('trackInput').value.trim().toUpperCase();
  const box = document.getElementById('trackResult');
  if (!tok) return alert('⚠️ Enter your Token Number first!');
  if (trackTimerInt) clearInterval(trackTimerInt);
  box.style.display = 'block';
  box.innerText = '⏳ Checking token status...';
  try {
    const r = await fetch('/api/track/' + encodeURIComponent(tok));
    if (!r.ok) {
      box.innerHTML = '<span style="color:#f87171;font-weight:700;">❌ Token not found or expired (3-day limit).</span>';
      return;
    }
    const d = await r.json();
    if (d.status === 'Paid') {
      const slipHtml = d.payoutSlipUrl
        ? `<img src="${d.payoutSlipUrl}" style="max-width:100%;max-height:220px;border-radius:10px;margin:10px auto;display:block;border:1px solid #10b981;" />
           <a href="${d.payoutSlipUrl}" download="${d.token}-INR-Slip.jpg" target="_blank" style="display:inline-block;background:#10b981;color:#02140d;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;font-size:12px;">⬇️ Download Payment Slip</a>`
        : '';
      box.innerHTML = `<div style="color:#34d399;font-size:16px;font-weight:800;">✅ PAYMENT SUCCESSFUL (PAID)</div><div style="color:#cbd5e1;margin-top:4px;">${d.token} • ${d.usdt} USDT → <b>₹${Number(d.inr).toLocaleString('en-IN')}</b></div>${slipHtml}`;
    } else {
      let rem = d.remSeconds;
      const drawRem = () => {
        if (rem <= 0) {
          clearInterval(trackTimerInt);
          box.innerHTML = `<div style="color:#fbbf24;font-weight:800;">⚠️ Time Window Completed (00:00)</div><div style="color:#94a3b8;margin-top:4px;">Status: Pending Admin Verification</div>`;
        } else {
          box.innerHTML = `<div style="color:#fbbf24;font-size:15px;font-weight:800;">⏳ PAYOUT IN PROGRESS</div><div style="font-size:18px;font-weight:900;color:#38bdf8;margin:4px 0;">Remaining Time: ${fmtTime(rem)}</div><div style="color:#94a3b8;font-size:12px;">${d.token} • ${d.usdt} USDT → ₹${Number(d.inr).toLocaleString('en-IN')}</div>`;
          rem--;
        }
      };
      drawRem();
      trackTimerInt = setInterval(drawRem, 1000);
    }
  } catch (e) { box.innerText = '❌ Error checking status.'; }
}
function previewSlip(input) {
  const box = document.getElementById('slipPreviewBox');
  const img = document.getElementById('slipPreviewImg');
  const fileObj = input.files ? input.files.item(0) : null;
  if (fileObj) { img.src = URL.createObjectURL(fileObj); box.style.display = 'block'; }
  else { box.style.display = 'none'; }
}

function renderQrBox(addr) {
  const box = document.getElementById('qrContainer');
  if (!box) return;
  box.innerHTML = '';
  if (customQrUrl) {
    const im = document.createElement('img');
    im.src = customQrUrl + '?t=' + Date.now();
    im.onerror = function() { box.innerHTML = ''; new QRCode(box, { text: addr, width: 180, height: 180 }); };
    box.appendChild(im);
  } else { new QRCode(box, { text: addr, width: 180, height: 180 }); }
}

async function loadState() {
  buildUI();
  renderCards();
  try {
    const r = await fetch('/api/state');
    const d = await r.json();
    if (d.isOpen === false) {
      document.getElementById('closedBox').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
      return;
    }
    rates = d.rates; mins = d.minLimits; walletAddr = d.settings.wallet; customQrUrl = d.qrUrl || '';
    document.getElementById('walletBox').innerText = walletAddr;
    document.getElementById('supLink').href = d.settings.enquiryLink;
  } catch (e) {}
  renderQrBox(walletAddr); renderCards(); calcOnly();
}

function renderCards() {
  const grid = document.getElementById('fundGrid');
  if (!grid) return;
  grid.innerHTML = '';
  Object.keys(labels).forEach(k => {
    const c = el('div', 'wave-card' + (curFund === k ? ' active' : ''));
    c.onclick = () => { curFund = k; renderCards(); calcOnly(); };
    c.append(el('div', 'wc-name', labels[k]), el('div', 'wc-rate', '₹' + rates[k]), el('div', 'wc-min', 'Min: ' + mins[k] + ' USDT'));
    grid.appendChild(c);
  });
  document.getElementById('selRateTxt').innerText = '1 USDT = ₹' + rates[curFund];
  document.getElementById('selFundPill').innerText = labels[curFund];
  document.getElementById('minInputLbl').innerText = 'Enter USDT Amount (Minimum ' + mins[curFund] + ' USDT)';
}

function calcOnly() {
  const u = parseFloat(document.getElementById('usdtAmt').value) || 0;
  document.getElementById('inrVal').innerText = '₹' + (u * (Number(rates[curFund]) || 0)).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function tryProceed() {
  const u = parseFloat(document.getElementById('usdtAmt').value) || 0;
  const minReq = Number(mins[curFund]) || 1000;
  const name = document.getElementById('accName').value.trim();
  const num  = document.getElementById('accNum').value.trim();
  const ifsc = document.getElementById('ifsc').value.trim();
  if (u < minReq) return alert('⚠️ Minimum ' + minReq + ' USDT required for ' + labels[curFund] + '!');
  if (!name || !num || !ifsc) return alert('⚠️ Please fill Account Holder Name, Account Number, and IFSC Code!');
  document.getElementById('p2Fund').innerText = labels[curFund];
  document.getElementById('p2Rate').innerText = '₹' + rates[curFund] + ' / USDT';
  document.getElementById('p2Usdt').innerText = u + ' USDT';
  document.getElementById('p2Inr').innerText = document.getElementById('inrVal').innerText;
  renderQrBox(walletAddr);
  document.getElementById('page1').style.display = 'none';
  document.getElementById('page2').style.display = 'block';
  window.scrollTo(0, 0);
}

function goPage1() { document.getElementById('page2').style.display = 'none'; document.getElementById('page1').style.display = 'block'; }
function copyW() { navigator.clipboard.writeText(document.getElementById('walletBox').innerText); alert('✅ TRC-20 Address Copied!'); }

async function submitFinal() {
  const inp = document.getElementById('receiptFile');
  const fileObj = inp.files ? inp.files.item(0) : null;
  if (!fileObj) return alert('⚠️ Please upload your payment receipt screenshot first!');
  const btn = document.getElementById('subBtn'); btn.disabled = true; btn.innerText = '⏳ Uploading Receipt...';
  const fd = new FormData();
  fd.append('fund', curFund);
  fd.append('usdt', String(parseFloat(document.getElementById('usdtAmt').value) || 0));
  fd.append('holder', document.getElementById('accName').value.trim());
  fd.append('accNo', document.getElementById('accNum').value.trim());
  fd.append('ifsc', document.getElementById('ifsc').value.trim().toUpperCase());
  fd.append('receipt', fileObj);
  try {
    const r = await fetch('/api/order', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) {
      document.getElementById('finalToken').innerText = j.token;
      document.getElementById('finalInr').innerText = '₹' + Number(j.inr).toLocaleString('en-IN', { minimumFractionDigits: 2 });
      document.getElementById('page2').style.display = 'none';
      document.getElementById('page3').style.display = 'block';
      startFinalCountdown();
    } else { alert('❌ ' + (j.msg || 'Submission failed!')); btn.disabled = false; btn.innerText = '✅ Submit Receipt & Generate Token'; }
  } catch (e) { alert('❌ Network error.'); btn.disabled = false; btn.innerText = '✅ Submit Receipt & Generate Token'; }
}
loadState();
</script>
</body>
</html>
